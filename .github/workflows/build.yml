---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * 1'  # Mondays; Renovate triggers the rest
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_NAME: os_build
  IMAGE_REGISTRY: ghcr.io/bourbonfgiles

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Justfile
        run: just check

      - name: Build image
        run: just build

      - name: Rechunk
        run: just rechunk

      - name: Tag image
        id: tags
        run: |
          tags="$(just tags)"
          for tag in ${tags}; do
            podman tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${tag}"
          done
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Pull requests build and verify only; publishing happens on main.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euxo pipefail
          # Each push can give a different manifest digest; sign the one bootc pulls.
          for tag in ${TAGS}; do
            [[ ${tag} == latest ]] || podman push "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:latest" "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.4'

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # rpm-ostree only verifies the old bundle format:
          # https://github.com/coreos/rpm-ostree/issues/5509
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
